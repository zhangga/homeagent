name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - name: Configure compiler module caches
        run: |
          echo "CLANG_MODULE_CACHE_PATH=$RUNNER_TEMP/homeagent-clang-cache" >> "$GITHUB_ENV"
          echo "SWIFT_MODULECACHE_PATH=$RUNNER_TEMP/homeagent-swift-cache" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run typecheck
      - run: bun run evaluate:quality
      - run: bun run verify:crash-recovery
